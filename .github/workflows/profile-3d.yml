name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name ducmanh-jr
          git config user.email nguyenducmanh.ducmanhjr@gmail.com
          git add -A .
          git diff --quiet && git diff --staged --quiet || git commit -m "profile-3d"
          git push
